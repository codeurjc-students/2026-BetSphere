name: Full CI

on:
  pull_request:
    branches:
      - main

jobs:
  full-quality-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. PREPARE ENVIROMENTS ---
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # --- 2. FRONTEND (Unit & Build) ---
      - name: Test version preparation
        run: node --test .github/scripts/set-versions.test.mjs

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # --- 3. BACKEND (Unit, integration & System) ---
      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Prepare Maven distribution
        working-directory: ./backend
        env:
          MVNW_VERBOSE: 'true'
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Maven download failed on attempt $attempt. Retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "::error::Maven Wrapper could not start after 3 attempts."
          exit 1

      - name: Run ALL backend tests (Unit, Integration, System)
        working-directory: ./backend
        run: xvfb-run ./mvnw test
