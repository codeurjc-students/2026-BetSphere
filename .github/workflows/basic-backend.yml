name: Basic Backend CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Save dependencies so future executions will be faster

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw # Permission for safety

      - name: Prepare Maven distribution
        working-directory: ./backend
        env:
          MVNW_VERBOSE: 'true'
        run: |
          for attempt in 1 2 3; do
            if ./mvnw --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Maven download failed on attempt $attempt. Retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "::error::Maven Wrapper could not start after 3 attempts."
          exit 1

      - name: Compile application
        working-directory: ./backend
        run: ./mvnw clean compile test-compile

      - name: Run backend tests without browser suites
        working-directory: ./backend
        run: ./mvnw test -Dtest="!**/e2e/ui/**,!**/integration/clientapi/**"
