name: Basic Backend CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Save dependencies so future executions will be faster

      - name: Make Maven Wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw # Permission for safety

      - name: Compile application
        working-directory: ./backend
        run: ./mvnw clean compile test-compile

      - name: Run unit tests
        working-directory: ./backend
        run: ./mvnw test