name: Publish Docker artifacts

on:
  workflow_call:
    inputs:
      source-ref:
        description: Git reference or commit to build
        required: true
        type: string
      artifact-tag:
        description: Docker tag for both the application and Compose artifact
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: huugoocm/betsphere
      COMPOSE_REPOSITORY: huugoocm/betsphere-compose
      ARTIFACT_TAG: ${{ inputs.artifact-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Prepare publication metadata and Compose
        id: publication
        shell: bash
        run: |
          if [[ ! "$ARTIFACT_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path("docker/docker-compose.yml").read_text()
          image = f"{os.environ['IMAGE_REPOSITORY']}:{os.environ['ARTIFACT_TAG']}"
          compose, count = re.subn(
              r"(?m)^(    image: )huugoocm/betsphere:[^\s]+$",
              lambda match: match[1] + image,
              source,
          )
          if count != 1:
              raise SystemExit("Expected exactly one BetSphere application image in Compose.")
          pathlib.Path("docker/docker-compose.publish.yml").write_text(compose)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v5.6.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish application image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.ARTIFACT_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.publication.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Compose OCI artifact
        run: docker compose -f docker/docker-compose.publish.yml publish --yes "$COMPOSE_REPOSITORY:$ARTIFACT_TAG"

      - name: Record published artifacts
        env:
          SOURCE_SHA: ${{ steps.publication.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "Source commit $SOURCE_SHA"
            echo ""
            echo "Application image $IMAGE_REPOSITORY:$ARTIFACT_TAG"
            echo ""
            echo "Image digest $IMAGE_DIGEST"
            echo ""
            echo "Compose artifact oci://docker.io/$COMPOSE_REPOSITORY:$ARTIFACT_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
