name: Continuous Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      source-ref: ${{ github.sha }}
      artifact-tag: dev
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
