openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/matches/:
    get:
      tags:
      - match-rest-controller
      operationId: getMatches
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchDTO"
components:
  schemas:
    MatchDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        homeTeam:
          type: string
        awayTeam:
          type: string
        matchDate:
          type: string
          format: date-time
        homeOdds:
          type: number
          format: double
        drawOdds:
          type: number
          format: double
        awayOdds:
          type: number
          format: double
        status:
          type: string
